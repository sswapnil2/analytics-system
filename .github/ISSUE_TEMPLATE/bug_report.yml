name: Bug report
description: Something is broken, or a number looks wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security problem? Don't file it here. Use the Security tab (see SECURITY.md)."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands, requests or the smallest set of events that shows the problem. For wrong numbers, include the events you sent and the result you expected.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Pulse commit or version
      placeholder: e.g. a709476
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Ingest, Funnels, Trends, Retention, Journeys, Cohorts, Session replay, Flags and experiments, Studio UI, Web SDK, Mobile core, MCP, Deployment, Other]
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, how you run the node (role, storage backend, Postgres or SQLite), browser if relevant.
