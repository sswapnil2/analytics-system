name: Build Linux binaries

# Manual only. Produces pulse-node + Studio tarballs for arm64 and x86_64 servers.
# Built on Ubuntu 22.04 (glibc 2.35) so it runs on Ubuntu 22.04+/Debian 12+.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04-arm
            arch: aarch64
          - runner: ubuntu-22.04
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix web ci && npm --prefix web run build
      - run: rustup show # installs the toolchain pinned in rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p pulse-node
      - run: |
          mkdir -p out/pulse/web
          cp target/release/pulse-node out/pulse/
          cp -r web/dist out/pulse/web/
          cp deploy/* out/pulse/
          tar -C out -czf pulse-linux-${{ matrix.arch }}.tar.gz pulse
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-linux-${{ matrix.arch }}
          path: pulse-linux-${{ matrix.arch }}.tar.gz
          retention-days: 14
