[workspace]
resolver = "3"
members = [
    "crates/pulse-wire",
    "crates/pulse-identity",
    "crates/pulse-storage",
    "crates/pulse-ingest",
    "crates/pulse-exec",
    "crates/pulse-control",
    "crates/pulse-sdk-core",
    "crates/pulse-node",
    "sdks/bindings-gen",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Pulse contributors"]
repository = "https://github.com/sswapnil2/analytics-system"
homepage = "https://sswapnil2.github.io/analytics-system/"

[workspace.dependencies]
# Internal workspace crates
pulse-wire = { path = "crates/pulse-wire" }
pulse-identity = { path = "crates/pulse-identity" }
pulse-storage = { path = "crates/pulse-storage" }
pulse-ingest = { path = "crates/pulse-ingest" }
pulse-exec = { path = "crates/pulse-exec" }
pulse-control = { path = "crates/pulse-control" }
pulse-sdk-core = { path = "crates/pulse-sdk-core" }

# Async & Web
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7.9", features = ["macros", "json"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6.2", features = ["cors", "fs", "trace", "compression-gzip", "compression-br", "set-header"] }
quinn = "0.11.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13"
prost = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures = "0.3"
async-trait = "0.1"

# Storage & Formats
vortex = { version = "=0.43.0", features = ["object_store", "tokio"] }
vortex-array = "=0.43.0"
vortex-file = { version = "=0.43.0", features = ["object_store", "tokio"] }
vortex-dtype = "=0.43.0"
vortex-buffer = "=0.43.0"
vortex-scalar = "=0.43.0"
vortex-error = "=0.43.0"
vortex-io = { version = "=0.43.0", features = ["object_store", "tokio"] }
arrow = { version = "55.1.0", features = ["prettyprint"] }
arrow-array = "55.1.0"
arrow-buffer = "55.1.0"
arrow-cast = "55.1.0"
arrow-ord = "55.1.0"
arrow-schema = "55.1.0"
arrow-select = "55.1.0"
parquet = { version = "55.1.0", features = ["arrow", "async"] }
slatedb = { version = "=0.6.0", features = ["aws", "moka"] }
object_store = { version = "0.12.1", features = ["aws"] }
foyer = { version = "0.22.3", features = ["serde"] }
url = "2.5"

# Compute & Indexing
datafusion = { version = "48.0.0", default-features = false, features = ["string_expressions", "unicode_expressions", "crypto_expressions", "regex_expressions", "datetime_expressions"] }
roaring = { version = "0.10.12", features = ["serde"] }
sketches-ddsketch = { version = "0.4.2", features = ["use_serde"] }
xxhash-rust = { version = "0.8.12", features = ["xxh3", "const_xxh3"] }
crc32fast = "1.4"
zstd = "0.13"
dashmap = "6.1"
parking_lot = "0.12"
bytes = { version = "1.7", features = ["serde"] }
bytemuck = { version = "1.18", features = ["derive"] }
rayon = "1.10"

# Control Plane & Serialization
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-rustls-ring", "sqlite", "postgres", "macros", "migrate", "chrono", "uuid", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
csv = "1.3"
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rand = "0.8"
ring = "0.17.14"
sha2 = "0.10.9"
argon2 = "0.5"
base64 = "0.22"
hex = "0.4.3"
constant_time_eq = "0.4.2"
chrono-tz = "0.10.4"
moka = { version = "0.12.16", features = ["sync"] }
tempfile = "3.12"

# FFI
uniffi = { version = "0.28.3", features = ["tokio"] }

# Argon2 is unusably slow unoptimized; keep debug builds/tests fast.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
